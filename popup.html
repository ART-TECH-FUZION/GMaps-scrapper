<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 230px;
      padding: 12px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      margin-top: 8px;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .status-box {
      background: #f4f4f4;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <h3>G-Maps Scraper</h3>
  <div class="status-box">
    Available Leads: <b id="leadCount">0</b>
  </div>
  <button id="loadMoreBtn">Auto-Scroll & Load All</button>
  <button id="scrapeBtn">Scrape & Export CSV</button>

  <script src="popup.js"></script>
</body>
</html>
